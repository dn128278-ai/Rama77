name: Build RAMA77 Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Extract Project ZIP & Auto-Fix XML Errors
      run: |
        set -e
        ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project
          
          PROJECT_ROOT=$(find extracted_project -name "settings.gradle*" -exec dirname {} \;)
          
          if [ -n "$PROJECT_ROOT" ]; then
            echo "Moving extracted files to root directory from $PROJECT_ROOT..."
            cp -r $PROJECT_ROOT/* .
            cp -r $PROJECT_ROOT/.* . 2>/dev/null || true
          fi
        fi

        # Auto-fix strings.xml unescaped quote issue
        STRINGS_FILE="app/src/main/res/values/strings.xml"
        if [ -f "$STRINGS_FILE" ]; then
          echo "Checking and fixing strings.xml..."
          sed -i "s/Don't have an account?/Don\\\'t have an account?/g" "$STRINGS_FILE" || true
        fi

    - name: Grant Execute Permission for Gradle
      run: |
        chmod +x gradlew || true
        gradle wrapper --gradle-version 8.6

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Final-APK
        path: app/build/outputs/apk/debug/app-debug.apk
