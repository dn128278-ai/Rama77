name: Build RAMA77 Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Extract Project ZIP & Auto-Fix Resource References
      run: |
        set -e
        ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project
          
          PROJECT_ROOT=$(find extracted_project -name "settings.gradle*" -exec dirname {} \;)
          
          if [ -n "$PROJECT_ROOT" ]; then
            echo "Moving extracted files to root directory from $PROJECT_ROOT..."
            cp -r $PROJECT_ROOT/* .
            cp -r $PROJECT_ROOT/.* . 2>/dev/null || true
          fi
        fi

        # Auto-fix 1: strings.xml unescaped quote issue
        STRINGS_FILE="app/src/main/res/values/strings.xml"
        if [ -f "$STRINGS_FILE" ]; then
          echo "Checking and fixing strings.xml..."
          sed -i "s/Don't have an account?/Don\\\'t have an account?/g" "$STRINGS_FILE" || true
        fi

        # Auto-fix 2: fragment_support.xml missing xmlns:app namespace issue
        SUPPORT_FILE="app/src/main/res/layout/fragment_support.xml"
        if [ -f "$SUPPORT_FILE" ]; then
          echo "Checking and fixing fragment_support.xml..."
          sed -i 's/<androidx.cardview.widget.CardView/<androidx.cardview.widget.CardView xmlns:app="http:\/\/schemas.android.com\/apk\/res-auto"/g' "$SUPPORT_FILE" || true
        fi

        # Auto-fix 3: Add missing Widget.RAMA77 style in styles/themes XML to pass AAPT linking
        THEMES_FILE="app/src/main/res/values/themes.xml"
        STYLES_FILE="app/src/main/res/values/styles.xml"
        TARGET_FILE=""
        if [ -f "$THEMES_FILE" ]; then
          TARGET_FILE="$THEMES_FILE"
        elif [ -f "$STYLES_FILE" ]; then
          TARGET_FILE="$STYLES_FILE"
        fi

        if [ -n "$TARGET_FILE" ]; then
          echo "Adding missing Widget.RAMA77 style to $TARGET_FILE..."
          sed -i 's/<\/resources>/    <style name="Widget.RAMA77" parent="Widget.MaterialComponents.CardView">\n        <item name="cardCornerRadius">12dp<\/item>\n        <item name="cardElevation">4dp<\/item>\n    <\/style>\n<\/resources>/g' "$TARGET_FILE" || true
        fi

    - name: Grant Execute Permission for Gradle
      run: |
        chmod +x gradlew || true
        gradle wrapper --gradle-version 8.6

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Final-APK
        path: app/build/outputs/apk/debug/app-debug.apk
