name: Build RAMA77 Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Extract Project ZIP & Fix Resource Linking
      run: |
        set -e
        ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project
          
          PROJECT_ROOT=$(find extracted_project -name "settings.gradle*" -exec dirname {} \;)
          if [ -n "$PROJECT_ROOT" ]; then
            echo "Moving extracted files to root directory..."
            cp -r $PROJECT_ROOT/* .
            cp -r $PROJECT_ROOT/.* . 2>/dev/null || true
          fi
        fi

        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/color

        # 1. XML rules
        echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup disableIfNoEncryptionCapabilities="true"/></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
        echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content/>' > app/src/main/res/xml/backup_rules.xml

        # 2. Launcher icons
        echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@android:color/white"/><foreground android:drawable="@drawable/ic_rama77_brand_logo"/></adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@android:color/white"/><foreground android:drawable="@drawable/ic_rama77_brand_logo"/></adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

        if [ ! -f "app/src/main/res/drawable/ic_rama77_brand_logo.xml" ]; then
          echo '<vector xmlns:android="http://schemas.android.com/apk/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FF7A00" android:pathData="M0,0h108v108h-108z"/></vector>' > app/src/main/res/drawable/ic_rama77_brand_logo.xml
        fi

        # 3. Colors & Selectors
        COLORS_FILE="app/src/main/res/values/colors.xml"
        if [ -f "$COLORS_FILE" ]; then
          sed -i 's/<\/resources>/    <color name="bg_dark">#121212<\/color>\n    <color name="toolbar_dark">#1E1E1E<\/color>\n    <color name="helperTextColor">#888888<\/color>\n<\/resources>/g' "$COLORS_FILE" || true
        else
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="bg_dark">#121212</color><color name="toolbar_dark">#1E1E1E</color><color name="helperTextColor">#888888</color></resources>' > "$COLORS_FILE"
        fi

        echo '<?xml version="1.0" encoding="utf-8"?><selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_checked="true" android:color="#FF7A00"/><item android:color="#888888"/></selector>' > app/src/main/res/color/selector_nav_color.xml
        echo '<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="8dp"><TextView android:id="@+id/menuTitle" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#000000"/></LinearLayout>' > app/src/main/res/layout/item_funds_menu.xml

        # 4. Create attrs.xml
        echo '<?xml version="1.0" encoding="utf-8"?><resources><declare-styleable name="CustomStyleAttrs"><attr name="helperTextColor" format="color|reference"/></declare-styleable></resources>' > app/src/main/res/values/attrs.xml

        # 5. Inject clean styles into styles.xml
        echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="Widget.RAMA77" parent="Widget.MaterialComponents.CardView"><item name="cardCornerRadius">12dp</item><item name="cardElevation">4dp</item></style><style name="VpinBoxStyle" parent="Widget.MaterialComponents.TextInputLayout.OutlinedBox"><item name="boxStrokeColor">#FF7A00</item></style></resources>' > app/src/main/res/values/styles.xml

        # 6. Fix strings.xml & CardView namespace
        STRINGS_FILE="app/src/main/res/values/strings.xml"
        if [ -f "$STRINGS_FILE" ]; then
          sed -i "s/Don't have an account?/Don\\\'t have an account?/g" "$STRINGS_FILE" || true
        fi

        SUPPORT_FILE="app/src/main/res/layout/fragment_support.xml"
        if [ -f "$SUPPORT_FILE" ]; then
          sed -i 's/<androidx.cardview.widget.CardView/<androidx.cardview.widget.CardView xmlns:app="http:\/\/schemas.android.com\/apk\/res-auto"/g' "$SUPPORT_FILE" || true
        fi

    - name: Grant Execute Permission for Gradle
      run: |
        chmod +x gradlew || true
        gradle wrapper --gradle-version 8.6

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Final-APK
        path: app/build/outputs/apk/debug/app-debug.apk
